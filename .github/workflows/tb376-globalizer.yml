name: TB376FC Globalizer

on:
  push:
    branches:
      - agent/tb376fc-globalizer
    paths:
      - '.github/workflows/tb376-globalizer.yml'
      - '.github/tb376-apply/**'
      - 'crates/ltbox-core/**'
      - 'crates/ltbox-device/**'
      - 'crates/ltbox-patch/**'
      - 'crates/ltbox-gui/examples/tb376-globalizer.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tb376-globalizer.yml'
      - 'crates/ltbox-core/**'
      - 'crates/ltbox-device/**'
      - 'crates/ltbox-patch/**'
      - 'crates/ltbox-gui/examples/tb376-globalizer.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: '0'

jobs:
  apply-fdt-fix:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/tb376fc-globalizer
          fetch-depth: 0

      - name: Reconstruct and apply validated patch
        shell: pwsh
        run: |
          $encoded = (Get-ChildItem '.github\tb376-apply\part-*' |
            Sort-Object Name |
            ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $script = Join-Path $env:RUNNER_TEMP 'apply_tb376_patch.py'
          [IO.File]::WriteAllBytes($script, [Convert]::FromBase64String($encoded))
          @'
          from pathlib import Path
          path = Path(r'__SCRIPT_PATH__')
          text = path.read_text()
          old = "once('patch_vendor_boot_product_region(', 'patch_vendor_boot_region_country(')"
          new = "s = s.replace('patch_vendor_boot_product_region(', 'patch_vendor_boot_region_country(')"
          if text.count(old) != 1:
              raise SystemExit(f'expected one rename helper line, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          '@.Replace('__SCRIPT_PATH__', $script.Replace('\', '\\')) | python -
          python $script
          cargo fmt --all

      - name: Commit validated code
        shell: pwsh
        run: |
          git rm -r .github/tb376-apply .github/tb376-patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ltbox-patch/src/tb376.rs
          git diff --cached --stat
          git commit -m "Fix TB376 vendor_boot FDT region parsing"
          git push origin HEAD:agent/tb376fc-globalizer

  build-windows-x64:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: TB376 unit tests
        run: cargo test --locked -p ltbox-patch tb376

      - name: Build release CLI
        run: cargo build --locked --release -p ltbox-gui --example tb376-globalizer

      - name: Stage artifact
        id: stage
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $source = Join-Path $PWD 'target\release\examples\tb376-globalizer.exe'
          $target = Join-Path $dist 'tb376-globalizer-win-x64.exe'
          Copy-Item $source $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash
          "$hash  tb376-globalizer-win-x64.exe" | Set-Content -Encoding ascii (Join-Path $dist 'tb376-globalizer-win-x64.exe.sha256')
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: tb376-globalizer-win-x64-${{ github.sha }}
          path: |
            dist/tb376-globalizer-win-x64.exe
            dist/tb376-globalizer-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## TB376FC Globalizer

          - Target: Windows x64
          - SHA-256: `${{ steps.stage.outputs.sha256 }}`
          - Flash profile: TB376FC → TB390FU 18.0.10.335
          - Bootloader must be officially unlocked
          - Never relock after cross-flashing
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
