name: TB376 Kernel EDL Fix

on:
  push:
    branches:
      - agent/tb376fc-globalizer
    paths:
      - '.github/workflows/tb376-kernel-edl-fix.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tb376fc-globalizer
          fetch-depth: 0

      - name: Force Windows kernel COM backend
        shell: pwsh
        run: |
          $path = 'crates/ltbox-gui/examples/tb376-globalizer.rs'
          $text = Get-Content $path -Raw
          $oldImport = 'use ltbox_device::edl::{EdlSession, GptPartitionInfo};'
          $newImport = @'
          use ltbox_device::driver::{QcomDriverMode, set_qcom_driver_mode};
          use ltbox_device::edl::{EdlSession, GptPartitionInfo};
          '@.Trim()
          if (-not $text.Contains($oldImport)) { throw 'EDL import anchor not found' }
          $text = $text.Replace($oldImport, $newImport)
          $oldMain = @'
          fn main() {
              if let Err(error) = run() {
          '@
          $newMain = @'
          fn main() {
              // The standalone CLI has no GUI settings bootstrap. Windows TB376FC
              // uses Qualcomm's signed QDLoader serial driver, so force the qdl
              // kernel/COM backend instead of the process default WinUSB backend.
              #[cfg(windows)]
              set_qcom_driver_mode(QcomDriverMode::Kernel);

              if let Err(error) = run() {
          '@
          if (-not $text.Contains($oldMain)) { throw 'main anchor not found' }
          $text = $text.Replace($oldMain, $newMain)
          Set-Content $path $text -Encoding utf8NoBOM

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Format, test and build
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p ltbox-patch tb376
          cargo clippy --locked -p ltbox-gui --example tb376-globalizer -- -D warnings
          cargo build --locked --release -p ltbox-gui --example tb376-globalizer

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ltbox-gui/examples/tb376-globalizer.rs
          git commit -m 'Force TB376 CLI to use kernel EDL backend'
          git push origin HEAD:agent/tb376fc-globalizer

      - name: Stage artifact
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $source = 'target\release\examples\tb376-globalizer.exe'
          $target = 'dist\tb376-globalizer-win-x64-kernel-edl.exe'
          Copy-Item $source $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash
          "$hash  tb376-globalizer-win-x64-kernel-edl.exe" | Set-Content -Encoding ascii 'dist\tb376-globalizer-win-x64-kernel-edl.exe.sha256'
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: tb376-globalizer-kernel-edl-${{ github.sha }}
          path: |
            dist/tb376-globalizer-win-x64-kernel-edl.exe
            dist/tb376-globalizer-win-x64-kernel-edl.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## TB376 kernel EDL fix
          - Backend: Qualcomm QDLoader serial/COM
          - SHA-256: `${{ steps.stage.outputs.sha256 }}`
          - No WinUSB/Zadig driver replacement required
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
