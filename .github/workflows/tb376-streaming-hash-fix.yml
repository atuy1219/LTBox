name: TB376 Streaming Hash Fix

on:
  push:
    branches:
      - agent/tb376fc-globalizer
    paths:
      - '.github/workflows/tb376-streaming-hash-fix.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tb376fc-globalizer
          fetch-depth: 0

      - name: Replace whole-file SHA-256 with streaming hash
        shell: pwsh
        run: |
          $path = 'crates/ltbox-patch/src/tb376_flash.rs'
          $text = Get-Content $path -Raw

          $oldImport = 'use std::fmt::Write as _;'
          $newImport = @'
          use std::fmt::Write as _;
          use std::io::Read;
          '@.Trim()
          if (-not $text.Contains($oldImport)) { throw 'fmt import anchor not found' }
          $text = $text.Replace($oldImport, $newImport)

          $oldFunction = @'
          pub fn sha256_file(path: &Path) -> Result<String> {
              let digest = Sha256::digest(fs::read(path)?);
              let mut output = String::with_capacity(64);
              for byte in digest {
                  let _ = write!(&mut output, "{byte:02X}");
              }
              Ok(output)
          }
          '@
          $newFunction = @'
          pub fn sha256_file(path: &Path) -> Result<String> {
              const HASH_BUFFER_BYTES: usize = 1024 * 1024;

              let mut file = fs::File::open(path)?;
              let mut hasher = Sha256::new();
              let mut buffer = vec![0u8; HASH_BUFFER_BYTES];

              loop {
                  let read = file.read(&mut buffer)?;
                  if read == 0 {
                      break;
                  }
                  hasher.update(&buffer[..read]);
              }

              let digest = hasher.finalize();
              let mut output = String::with_capacity(64);
              for byte in digest {
                  let _ = write!(&mut output, "{byte:02X}");
              }
              Ok(output)
          }
          '@
          if (-not $text.Contains($oldFunction)) { throw 'sha256_file anchor not found' }
          $text = $text.Replace($oldFunction, $newFunction)

          Set-Content $path $text -Encoding utf8NoBOM

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Format, test and build
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p ltbox-patch tb376
          cargo clippy --locked -p ltbox-gui --example tb376-globalizer -- -D warnings
          cargo build --locked --release -p ltbox-gui --example tb376-globalizer

      - name: Commit source fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ltbox-patch/src/tb376_flash.rs
          git commit -m 'Stream TB376 firmware SHA-256 hashing'
          git push origin HEAD:agent/tb376fc-globalizer

      - name: Stage artifact
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $source = 'target\release\examples\tb376-globalizer.exe'
          $target = 'dist\tb376-globalizer-win-x64-streaming.exe'
          Copy-Item $source $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash
          "$hash  tb376-globalizer-win-x64-streaming.exe" | Set-Content -Encoding ascii 'dist\tb376-globalizer-win-x64-streaming.exe.sha256'
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: tb376-globalizer-streaming-${{ github.sha }}
          path: |
            dist/tb376-globalizer-win-x64-streaming.exe
            dist/tb376-globalizer-win-x64-streaming.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## TB376 streaming hash fix
          - SHA-256 input buffering: 1 MiB
          - Kernel/COM EDL backend retained
          - Executable SHA-256: `${{ steps.stage.outputs.sha256 }}`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
